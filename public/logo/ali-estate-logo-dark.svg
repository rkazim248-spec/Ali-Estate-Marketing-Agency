<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <!-- Background matches user image #1A1717 -->
  <rect width="1000" height="560" fill="#1A1717"/>

  <!-- Architectural House Icon with Curved Sweep & 4-Pane Window -->
  <g stroke="#FFFFFF" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pitched roof: left apex to eave, right apex to eave, right return and wall, swooping concave curve -->
    <!-- Apex: (725, 100) -->
    <!-- Left roofline down to eave: (565, 255) -->
    <path d="M725 100 L565 255" />
    
    <!-- Concave sweep from left eave under roofline down to base: from (565, 255) curving down to (800, 375) -->
    <path d="M565 255 C650 255 745 285 800 375" />

    <!-- Right roofline from apex down to eave: (725, 100) to (880, 255) -->
    <path d="M725 100 L880 255" />

    <!-- Right eave horizontal return to wall: (880, 255) to (830, 255) -->
    <path d="M880 255 L830 255" />

    <!-- Right wall straight down: (830, 255) down to base (830, 380) -->
    <path d="M830 255 L830 380" />

    <!-- Base horizontal connection: (800, 375) to (830, 380) -->
    <path d="M800 375 L830 375" />

    <!-- 4-Pane Square Window inside roof -->
    <!-- Window outer frame -->
    <rect x="700" y="195" width="44" height="44" stroke="#FFFFFF" stroke-width="7" fill="none" rx="2" />
    <!-- Window cross dividers -->
    <line x1="722" y1="195" x2="722" y2="239" stroke="#FFFFFF" stroke-width="6" />
    <line x1="700" y1="217" x2="744" y2="217" stroke="#FFFFFF" stroke-width="6" />
  </g>

  <!-- Typography: Ali Estate (Champagne Gold Serif) -->
  <text x="490" y="375" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="102" font-weight="500" fill="#C9A96E" letter-spacing="0.02em">
    Ali Estate
  </text>

  <!-- Typography: & Marketing Agency (Clean White Modern Sans) -->
  <text x="495" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="300" fill="#FFFFFF" letter-spacing="0.03em">
    &amp; Marketing Agency
  </text>
</svg>
