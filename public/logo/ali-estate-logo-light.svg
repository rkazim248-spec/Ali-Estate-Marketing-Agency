  </text>

  <!-- Typography: & MARKETING AGENCY (Charcoal on light) -->
  <text x="114" y="86" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.32em" fill="#181616">
